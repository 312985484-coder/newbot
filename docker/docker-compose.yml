version: '3.8'

services:
  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: telegreat-bot
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ADMIN_USER_IDS=${ADMIN_USER_IDS}
      - SUPER_ADMIN_USER_IDS=${SUPER_ADMIN_USER_IDS}
      - DATABASE_URL=sqlite:///data/telegreat.db
      - LOG_LEVEL=INFO
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    networks:
      - telegreat-network

networks:
  telegreat-network:
    driver: bridge
